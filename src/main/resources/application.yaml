spring:
  application:
    name: agentforge
  datasource:
    url: jdbc:postgresql://localhost:5432/agenthub
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  ai:
    zhipuai:
      api-key: ${ZHIPU_API_KEY:dummy-key-context-load}
      chat:
        options:
          model: glm-4.6
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:dummy-key-context-load}
      chat:
        options:
          model: deepseek-chat

# eshop 第二数据源（SqlQueryTool 专用，eshop_ro 只读角色）
eshop:
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop
    username: ${ESHOP_USER:eshop_ro}
    password: ${ESHOP_PASSWORD:eshop_ro_local}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.agentforge.model.entity
  type-handlers-package: com.agentforge.typehandler
  configuration:
    map-underscore-to-camel-case: true

agentforge:
  embedding:
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn}

document:
  storage:
    base-path: ./data/documents

server:
  port: 8080
